services:
  - type: web
    name: arg-instagram-automator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_IG_USER_ID
        sync: false
      - key: META_IG_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v27.0
      - key: META_GRAPH_API_HOST
        value: graph.facebook.com
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
